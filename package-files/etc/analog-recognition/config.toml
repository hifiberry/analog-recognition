[audiocontrol]
base_url = "http://localhost:1080/api"
player_name = "analog"

[songrec]
device = "riaa.monitor"
request_interval_secs = 10
binary = "songrec"

[vu_meter]
ws_url = "ws://localhost:2717/api/v1/levels"
start_threshold = 40
stop_threshold = 40
start_debounce_secs = 1
stop_debounce_secs = 20

[logging]
level = "info"
