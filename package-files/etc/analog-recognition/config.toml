[audiocontrol]
base_url = "http://localhost:1080/api"
player_name = "analog"

[songrec]
device = "input-processor.monitor"
request_interval_secs = 10
# songrec itself, or a wrapper that execs it -- the stream check below asks
# PipeWire about the pid of whatever is started here.
binary = "songrec"
# songrec can keep running with a dead capture stream -- a PipeWire restart
# leaves it that way -- and its stdout never closes, so watching the process
# cannot detect it. These check that it still holds a capture stream, and
# restart it when it does not. stream_check_secs = 0 turns the check off.
stream_check_secs = 30
stream_grace_secs = 20
pw_dump_binary = "pw-dump"

[vu_meter]
# The level for playback detection is captured directly from this PipeWire node
# -- the analog input chain, never the output mix -- so network players
# (Spotify/Tidal) are not mistaken for analog activity.
capture_target = "input-processor"
# Level thresholds on a 0-255 scale mapping -60dB..0dB (so 40 = -50.6 dBFS,
# 55 = -47 dBFS). Tune against your turntable/cartridge noise floor.
start_threshold = 40
stop_threshold = 40
start_debounce_secs = 1
stop_debounce_secs = 20

[logging]
level = "info"

[configurator]
base_url = "http://localhost:1081/api/v1"
songrec_enabled_key = "player.analog-recognition.songrec_enabled"
setting_poll_secs = 10
