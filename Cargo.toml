[package]
name = "analog-recognition"
version = "0.4.1"
edition = "2021"
description = "Identifies tracks on an analog input with songrec and reports play/stop state from the VU meter, publishing both into AudioControl"
license = "MIT"
repository = "https://github.com/hifiberry/analog-recognition"
readme = "README.md"

[lib]
name = "analog_recognition"
path = "src/lib.rs"

[dependencies]
pipewire = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# start_paused: the watchdog tests assert on timing (grace period, check
# interval) and would otherwise have to sleep in real time.
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
